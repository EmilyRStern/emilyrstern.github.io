<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 750" style="font-family:'Source Sans 3','Gill Sans',sans-serif;">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');
    ]]></style>
    <marker id="pipe-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5A6B3A"/>
    </marker>
    <marker id="pipe-arr-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6E6A55"/>
    </marker>
  </defs>

  <!-- Row 1: 3 Surveys -->
  <rect x="50" y="15" width="100" height="48" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Survey A</text>
  <text x="100" y="53" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">schema 1</text>

  <rect x="165" y="15" width="100" height="48" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="215" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Survey B</text>
  <text x="215" y="53" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">schema 2</text>

  <rect x="280" y="15" width="100" height="48" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="330" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Survey C</text>
  <text x="330" y="53" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">schema 3</text>

  <line x1="100" y1="65" x2="100" y2="89" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>
  <line x1="215" y1="65" x2="215" y2="89" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>
  <line x1="330" y1="65" x2="330" y2="89" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Row 2: 3 Standardize -->
  <rect x="50" y="95" width="100" height="48" rx="4" fill="#F2EDDF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="100" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Standardize A</text>
  <text x="100" y="132" text-anchor="middle" font-size="10" fill="#5A6B3A" font-family="'Source Code Pro',monospace">→ canonical</text>

  <rect x="165" y="95" width="100" height="48" rx="4" fill="#F2EDDF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="215" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Standardize B</text>
  <text x="215" y="132" text-anchor="middle" font-size="10" fill="#5A6B3A" font-family="'Source Code Pro',monospace">→ canonical</text>

  <rect x="280" y="95" width="100" height="48" rx="4" fill="#F2EDDF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="330" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Standardize C</text>
  <text x="330" y="132" text-anchor="middle" font-size="10" fill="#5A6B3A" font-family="'Source Code Pro',monospace">→ canonical</text>

  <!-- Convergence to canonical schema -->
  <path d="M 100 145 L 100 168 L 215 168" stroke="#5A6B3A" stroke-width="1.4" fill="none"/>
  <line x1="215" y1="145" x2="215" y2="168" stroke="#5A6B3A" stroke-width="1.4"/>
  <path d="M 330 145 L 330 168 L 215 168" stroke="#5A6B3A" stroke-width="1.4" fill="none"/>
  <line x1="215" y1="168" x2="215" y2="190" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Canonical schema -->
  <rect x="115" y="194" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#2B2A1F" stroke-width="1.5"/>
  <text x="215" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2A1F">Canonical schema</text>
  <text x="215" y="232" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">one shape downstream</text>

  <line x1="215" y1="246" x2="215" y2="272" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Eligibility logic -->
  <rect x="115" y="276" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="215" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2A1F">Eligibility logic</text>
  <text x="215" y="314" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">insurance + location</text>

  <line x1="215" y1="328" x2="215" y2="354" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Flagged records -->
  <rect x="115" y="358" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="215" y="379" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2A1F">Flagged records</text>
  <text x="215" y="396" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">per clinic</text>

  <line x1="215" y1="410" x2="215" y2="436" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Manual review (wider, prominent) -->
  <rect x="75" y="440" width="280" height="52" rx="4" fill="#FFFFFF" stroke="#2B2A1F" stroke-width="2"/>
  <text x="215" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2A1F">Manual review</text>
  <text x="215" y="480" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">reviewer can override flagged cases</text>

  <line x1="215" y1="494" x2="215" y2="520" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Unified dataset -->
  <rect x="115" y="524" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="215" y="545" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2A1F">Unified, cleaned dataset</text>
  <text x="215" y="562" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">decisions reconcilable to source</text>

  <line x1="215" y1="576" x2="215" y2="602" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Price snapshot -->
  <rect x="115" y="606" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1"/>
  <text x="215" y="627" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2A1F">Price snapshot</text>
  <text x="215" y="644" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">rate schedule saved each month</text>

  <line x1="215" y1="658" x2="215" y2="684" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#pipe-arr)"/>

  <!-- Shiny app -->
  <rect x="115" y="688" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#2B2A1F" stroke-width="1.5"/>
  <text x="215" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2A1F">Shiny app</text>
  <text x="215" y="726" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">deployed monthly</text>

  <!-- Monthly refresh loop arrow (left side, from shiny back up to surveys) -->
  <path d="M 115 713 C 25 713, 15 380, 15 50 C 15 28, 30 15, 50 15" stroke="#6E6A55" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#pipe-arr-mu)"/>

  <!-- Numbered annotations in mustard, anchored on the right side -->
  <!-- 1: at standardize row (input variance contained) -->
  <line x1="380" y1="119" x2="408" y2="119" stroke="#C99B2A" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="420" cy="119" r="12" fill="#C99B2A"/>
  <text x="420" y="124" text-anchor="middle" font-size="13" font-family="'Source Serif 4',Georgia,serif" fill="#FFFFFF" font-weight="700">1</text>

  <!-- 2: at manual review (first-class) -->
  <line x1="355" y1="466" x2="408" y2="466" stroke="#C99B2A" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="420" cy="466" r="12" fill="#C99B2A"/>
  <text x="420" y="471" text-anchor="middle" font-size="13" font-family="'Source Serif 4',Georgia,serif" fill="#FFFFFF" font-weight="700">2</text>

  <!-- 3: at price snapshot (snapshotted) -->
  <line x1="315" y1="631" x2="408" y2="631" stroke="#C99B2A" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="420" cy="631" r="12" fill="#C99B2A"/>
  <text x="420" y="636" text-anchor="middle" font-size="13" font-family="'Source Serif 4',Georgia,serif" fill="#FFFFFF" font-weight="700">3</text>

  <!-- 4: at shiny app (boring refresh) -->
  <line x1="315" y1="713" x2="408" y2="713" stroke="#C99B2A" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="420" cy="713" r="12" fill="#C99B2A"/>
  <text x="420" y="718" text-anchor="middle" font-size="13" font-family="'Source Serif 4',Georgia,serif" fill="#FFFFFF" font-weight="700">4</text>
</svg>
