<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" style="font-family:'Source Sans 3','Gill Sans',sans-serif;">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');
    ]]></style>
    <marker id="db-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5A6B3A"/>
    </marker>
  </defs>

  <!-- BEFORE column header -->
  <text x="80" y="20" text-anchor="middle" font-size="10" fill="#6E6A55" letter-spacing="1.6" font-weight="600">BEFORE</text>

  <!-- Three analyst boxes (fragmented inputs) -->
  <rect x="20" y="34" width="120" height="38" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="80" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Analyst A</text>
  <text x="80" y="65" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">custom API call</text>

  <rect x="20" y="80" width="120" height="38" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="80" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Analyst B</text>
  <text x="80" y="111" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">manual env setup</text>

  <rect x="20" y="126" width="120" height="38" rx="4" fill="#FFFFFF" stroke="#C9C0A4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="80" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#2B2A1F">Analyst C</text>
  <text x="80" y="157" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">connection failures</text>

  <!-- Converging arrows into databricks.R -->
  <path d="M 140 53 L 195 53 L 215 95" stroke="#5A6B3A" stroke-width="1.4" fill="none" marker-end="url(#db-arr)"/>
  <line x1="140" y1="99" x2="215" y2="99" stroke="#5A6B3A" stroke-width="1.4" marker-end="url(#db-arr)"/>
  <path d="M 140 145 L 195 145 L 215 103" stroke="#5A6B3A" stroke-width="1.4" fill="none" marker-end="url(#db-arr)"/>

  <!-- AFTER column header -->
  <text x="345" y="20" text-anchor="middle" font-size="10" fill="#5A6B3A" letter-spacing="1.6" font-weight="600">AFTER</text>

  <!-- Center: scripts/databricks.R container -->
  <rect x="220" y="34" width="250" height="130" rx="4" fill="#FFFFFF" stroke="#2B2A1F" stroke-width="1.5"/>
  <text x="345" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2A1F">scripts/databricks.R</text>
  <text x="345" y="71" text-anchor="middle" font-size="10" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">shared access layer</text>

  <!-- Submodules inside databricks.R -->
  <rect x="232" y="82" width="110" height="24" rx="3" fill="#F2EDDF" stroke="#C9C0A4"/>
  <text x="287" y="98" text-anchor="middle" font-size="10" fill="#2B2A1F" font-family="'Source Code Pro',monospace">config validation</text>

  <rect x="350" y="82" width="110" height="24" rx="3" fill="#F2EDDF" stroke="#C9C0A4"/>
  <text x="405" y="98" text-anchor="middle" font-size="10" fill="#2B2A1F" font-family="'Source Code Pro',monospace">databricks_query()</text>

  <rect x="232" y="112" width="110" height="24" rx="3" fill="#F2EDDF" stroke="#C9C0A4"/>
  <text x="287" y="128" text-anchor="middle" font-size="10" fill="#2B2A1F" font-family="'Source Code Pro',monospace">retry handling</text>

  <rect x="350" y="112" width="110" height="24" rx="3" fill="#F2EDDF" stroke="#C9C0A4"/>
  <text x="405" y="128" text-anchor="middle" font-size="10" fill="#2B2A1F" font-family="'Source Code Pro',monospace">type conversion</text>

  <text x="345" y="154" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">reusable across analysts and projects</text>

  <!-- Equals sign to output (databricks.R = consistent data access) -->
  <line x1="478" y1="94" x2="538" y2="94" stroke="#5A6B3A" stroke-width="1.8"/>
  <line x1="478" y1="104" x2="538" y2="104" stroke="#5A6B3A" stroke-width="1.8"/>

  <!-- Right: standardized output -->
  <rect x="545" y="59" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#2B2A1F" stroke-width="2"/>
  <text x="625" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2A1F">Consistent</text>
  <text x="625" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2A1F">data access</text>
  <text x="625" y="124" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">across the team</text>

  <!-- Bottom captions for each column -->
  <text x="80" y="195" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">access logic buried in</text>
  <text x="80" y="207" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">individual project code</text>

  <text x="345" y="195" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">centralized, documented</text>
  <text x="345" y="207" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">interface for the warehouse</text>

  <text x="625" y="195" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">setup friction reduced;</text>
  <text x="625" y="207" text-anchor="middle" font-size="9" fill="#6E6A55" font-style="italic" font-family="'Source Serif 4',serif">consistent across projects</text>
</svg>
