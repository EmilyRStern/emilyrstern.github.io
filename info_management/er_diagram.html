<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ER Diagram — Grants.gov Tracking Database</title>
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Segoe UI',system-ui,sans-serif; }
  h1 { text-align:center; font-size:26px; color:#1a1a2e; margin-bottom:4px; font-weight:700; }
  .subtitle { text-align:center; font-size:13px; color:#6b7280; margin-bottom:18px; }
  svg { display:block; margin:0 auto; }
</style>
</head>
<body>
<h1>E-R Diagram for Grants.gov Tracking Database</h1>
<p class="subtitle">EPPS 6354 Information Management — Spring 2026</p>
<svg width="920" height="660" viewBox="0 0 920 660">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- LINES -->
  <line x1="235" y1="120" x2="365" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="495" y1="120" x2="550" y2="120" stroke="#374151" stroke-width="2"/>
  <line x1="700" y1="215" x2="700" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="700" y1="355" x2="700" y2="415" stroke="#374151" stroke-width="2"/>
  <line x1="620" y1="215" x2="460" y2="340" stroke="#374151" stroke-width="5"/>
  <line x1="620" y1="215" x2="460" y2="340" stroke="#fff" stroke-width="2"/>
  <line x1="255" y1="405" x2="385" y2="340" stroke="#374151" stroke-width="2"/>

  <!-- ENTITIES -->
  <g transform="translate(60,62)">
    <rect x="0" y="0" width="175" height="115" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="32" x2="175" y2="32" stroke="#2563eb" stroke-width="1.5"/>
    <text x="87" y="23" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#1e3a5f">agencies</text>
    <text x="14" y="52" font-size="13" fill="#1f2937" text-decoration="underline">agency_id</text>
    <text x="14" y="72" font-size="13" fill="#1f2937">agency_name</text>
    <text x="14" y="92" font-size="13" fill="#1f2937">agency_code</text>
  </g>

  <g transform="translate(550,22)">
    <rect x="0" y="0" width="210" height="195" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="32" x2="210" y2="32" stroke="#2563eb" stroke-width="1.5"/>
    <text x="105" y="23" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#1e3a5f">opportunities</text>
    <text x="14" y="52" font-size="13" fill="#1f2937" text-decoration="underline">opportunity_id</text>
    <text x="14" y="72" font-size="13" fill="#1f2937">agency_id (FK)</text>
    <text x="14" y="92" font-size="13" fill="#1f2937">opportunity_title</text>
    <text x="14" y="112" font-size="13" fill="#1f2937">post_date</text>
    <text x="14" y="132" font-size="13" fill="#1f2937">close_date</text>
    <text x="14" y="152" font-size="13" fill="#1f2937">award_ceiling / award_floor</text>
    <text x="14" y="172" font-size="13" fill="#1f2937">estimated_total_funding</text>
    <text x="14" y="192" font-size="13" fill="#1f2937">opportunity_status</text>
  </g>

  <g transform="translate(615,415)">
    <rect x="0" y="0" width="170" height="95" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="32" x2="170" y2="32" stroke="#2563eb" stroke-width="1.5"/>
    <text x="85" y="23" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#1e3a5f">categories</text>
    <text x="14" y="52" font-size="13" fill="#1f2937" text-decoration="underline">category_code</text>
    <text x="14" y="72" font-size="13" fill="#1f2937">category_name</text>
  </g>

  <g transform="translate(60,355)">
    <rect x="0" y="0" width="195" height="115" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="32" x2="195" y2="32" stroke="#2563eb" stroke-width="1.5"/>
    <text x="97" y="23" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#1e3a5f">snapshots</text>
    <text x="14" y="52" font-size="13" fill="#1f2937" text-decoration="underline">snapshot_id</text>
    <text x="14" y="72" font-size="13" fill="#1f2937">snapshot_date</text>
    <text x="14" y="92" font-size="13" fill="#1f2937">record_count</text>
  </g>

  <!-- DIAMONDS -->
  <g transform="translate(430,120)">
    <polygon points="0,-35 65,0 0,35 -65,0" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#1f2937">sponsors</text>
  </g>

  <g transform="translate(700,318)">
    <polygon points="0,-38 72,0 0,38 -72,0" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#1f2937">classified_as</text>
  </g>

  <g transform="translate(440,340)">
    <polygon points="0,-42 82,0 0,42 -82,0" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#1f2937">change</text>
    <text x="0" y="12" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#1f2937">_detected</text>
  </g>

  <!-- DESCRIPTIVE ATTRIBUTES -->
  <g transform="translate(310,460)">
    <ellipse cx="0" cy="0" rx="58" ry="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">change_type</text>
  </g>
  <line x1="340" y1="448" x2="420" y2="382" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>

  <g transform="translate(445,470)">
    <ellipse cx="0" cy="0" rx="60" ry="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">field_changed</text>
  </g>
  <line x1="445" y1="454" x2="442" y2="382" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>

  <g transform="translate(575,450)">
    <ellipse cx="0" cy="0" rx="75" ry="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">old_value / new_value</text>
  </g>
  <line x1="535" y1="440" x2="478" y2="378" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>

  <g transform="translate(380,515)">
    <ellipse cx="0" cy="0" rx="58" ry="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">detected_date</text>
  </g>
  <line x1="398" y1="499" x2="435" y2="382" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- LEGEND -->
  <g transform="translate(30,575)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#374151">Legend</text>
    <rect x="0" y="10" width="20" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="22" font-size="11" fill="#6b7280">Entity</text>
    <polygon points="107,17 119,10 131,17 119,24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="139" y="22" font-size="11" fill="#6b7280">Relationship</text>
    <text x="238" y="22" font-size="11" fill="#6b7280" text-decoration="underline">attr</text>
    <text x="262" y="22" font-size="11" fill="#6b7280">= Primary Key</text>
    <line x1="375" y1="17" x2="405" y2="17" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="413" y="22" font-size="11" fill="#6b7280">= "one" side</text>
    <line x1="505" y1="17" x2="535" y2="17" stroke="#374151" stroke-width="5"/>
    <line x1="505" y1="17" x2="535" y2="17" stroke="#fff" stroke-width="2"/>
    <text x="543" y="22" font-size="11" fill="#6b7280">= total participation</text>
    <ellipse cx="715" cy="17" rx="18" ry="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="740" y="22" font-size="11" fill="#6b7280">= descriptive attribute</text>
  </g>

  <text x="460" y="630" text-anchor="middle" font-size="11" fill="#9ca3af">
    Notation follows Silberschatz, Korth &amp; Sudarshan, Database System Concepts, 7th ed., Ch. 6
  </text>
</svg>
</body>
</html>
